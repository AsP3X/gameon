# Local overlay: publish host ports. Used by ./deploy.sh when PROXY_MODE=local.
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build

services:
  postgres:
    # This machine only: cargo test and a local `cargo run`.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  api:
    ports:
      - "${API_PORT:-8080}:8080"

  ocho:
    ports:
      - "127.0.0.1:${OCHO_PORT:-8091}:8091"

  web:
    ports:
      - "${WEB_PORT:-8081}:80"

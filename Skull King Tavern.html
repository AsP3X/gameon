/* --- game table --- */
function pips(b,w){
  if(b==null||b<0)return'';
  const m=Math.max(b,w);let dots='';
  if(b===0&&w===0)dots='<i class="zero"></i>';
  else if(m<=6)for(let k=0;k<m;k++)dots+=`<i class="${k<w?(k<b?'ok':'over'):''}"></i>`;
  return`<span class="bidline ${ui.reveal?'pop':''}"><span class="pips">${dots}</span><b class="num">${w}/${b}</b></span>`;
}
function seatBid(v,i){
  if(v.phase!=='bidding')return pips(v.bids[i],v.won[i]);
  const b=v.bids[i];
  if(b==null)return'<span class="thinking" aria-label="Thinking"><i></i><i></i><i></i></span>';
  return`<span class="ready ${ui.just==='bid'+i?'pop':''}">${i===v.me&&!handHidden(v)?'Bid '+b:'Ready'}</span>`;
}
const who=(v,i)=>i===v.me?'You':esc(v.seats[i].name);
function statusText(v){
  switch(v.phase){
    case'bidding':return v.bids[v.me]==null&&!handHidden(v)?'How many tricks will you win?':`Waiting on ${v.bids.filter(b=>b==null).length} more`;
    case'playing':return v.turn===v.me?'Your turn':`${who(v,v.turn)} is thinking…`;
    case'trickEnd':{
      const r=v.lastTrick.result;
      if(r.winner==null)return r.effect==='kraken'?'The Kraken swallowed the trick':'The White Whale sank the trick';
      return`${who(v,r.winner)} ${r.winner===v.me?'take':'takes'} the trick`;
    }
    case'ability':{const a=Rules.ABILITY[v.pending.kind];return`${who(v,v.pending.seat)} ${v.pending.seat===v.me?'use':'uses'} the ${a.name}`}
    case'roundEnd':return'Round over';
    default:return'';
  }
}
function bonusText(v){
  if(ui.toast)return`<span class="pill gold wrap pop">${esc(ui.toast)}</span>`;
  if(v.phase!=='trickEnd'||v.lastTrick.result.winner==null)return'';
  const r=v.lastTrick.result,c=r.captures,b=[];
  if(c.sm)b.push('Mermaid caught the King +40');
  if(c.ps)b.push(`King took ${c.ps} pirate${c.ps>1?'s':''} +${30*c.ps}`);
  if(c.mp)b.push(`Pirate took ${c.mp} mermaid${c.mp>1?'s':''} +${20*c.mp}`);
  const f=10*c.b14+(c.black14?20:0);if(f)b.push(`14s +${f}`);
  if(r.loot.length)b.push('Loot alliance');
  if(v.lastTrick.ability)b.push(`${Rules.ABILITY[v.lastTrick.ability].name} power!`);
  return b.length?`<span class="pill gold wrap pop" style="animation-delay:.2s">${b.join(' · ')}</span>`:'';
}
function abilityToast(v,e){
  const name=e.seat===v.me?'You':v.seats[e.seat].name;
  switch(e.kind){
    case'helm':return`${name} picked ${e.choice===v.me?'you':v.seats[e.choice].name} to lead`;
    case'smuggler':return`${name} swapped ${e.count} cards with the deck`;
    case'gambler':return e.choice?`${name} bet ${e.choice} on making the bid`:`${name} passed on the bet`;
    case'seer':return`${name} peeked at the deck`;
    case'giant':return e.choice?`${name} changed the bid from ${e.from} to ${e.to}`:`${name} kept the bid at ${e.from}`;
  }
  return null;
}
function handMetrics(n){
  const W=Math.min(document.documentElement.clientWidth||390,560)-28;
  const cw=clamp(Math.floor(W/5.2),52,80);
  const ov=n>1?Math.min(6,Math.floor((W-n*cw)/(n-1))):0;
  return{cw,ov};
}
const KIND_ORDER={escape:0,loot:1,num:2,mermaid:3,pirate:4,tigress:5,sk:6,kraken:7,whale:8};
function sortHand(hand,deck){
  return hand.slice().sort((a,b)=>{const x=deck[a],y=deck[b];
    return KIND_ORDER[x.kind]-KIND_ORDER[y.kind]||(x.kind==='num'?Rules.SUITS.indexOf(x.suit)-Rules.SUITS.indexOf(y.suit)||x.rank-y.rank:a-b)});
}
function abilityPanel(v){
  const p=v.pending,a=Rules.ABILITY[p.kind];
  const head=`<p class="ask">${a.name}: ${a.desc}</p>`;
  switch(p.kind){
    case'helm':return head+`<div class="seatpick">${v.seats.map((s,i)=>`<button data-act="ability" data-v="${i}">${avatar(s,'sm')}<span>${i===v.me?'You':esc(s.name)}</span></button>`).join('')}</div>`;
    case'smuggler':{const k=p.drawn.length,picked=ui.discard.length;
      return`<p class="ask">Smuggler: you drew ${k} (gold edge). Tap ${k} cards to throw back.</p>
        <button class="btn ${picked===k?'wake':''}" data-act="ability" ${picked===k?'':'disabled'}>${picked===k?'Discard these':`Pick ${k-picked} more`}</button>`}
    case'gambler':return head+`<div class="btns">${[0,10,20].map(w=>`<button class="btn ${w?'gold':'ghost'}" data-act="ability" data-v="${w}">${w?'Bet '+w:'No bet'}</button>`).join('')}</div>`;
    case'seer':return head+`<button class="btn blue" data-act="peek">Look at the deck</button>`;
    case'giant':{const b=v.bids[v.me],w=v.won[v.me];
      return`<p class="ask">Giant: you bid ${b} and won ${w}. Change your bid?</p><div class="btns">${[-1,0,1].filter(d=>b+d>=0&&b+d<=v.cards).map(d=>`<button class="btn ${b+d===w?'':'ghost'}" data-act="ability" data-v="${d}">${d?`Bid ${b+d}`:`Keep ${b}`}</button>`).join('')}</div>`}
  }
  return'';
}
/** Buttons only where a card can't do the job: bidding, abilities, the Tigress choice, round results.
    Cards are played straight from the hand: tap to lift, tap the same card again to play it. */
function actionsView(v){
  const me=v.me,hint=t=>`<p class="hint">${t}</p>`;
  if(v.phase==='playing'||v.phase==='trickEnd'){
    if(handHidden(v))return hint('Hand hidden · pass-and-play');
    const c=ui.sel!=null?v.deck[ui.sel]:null,myTurn=v.phase==='playing'&&v.turn===me&&!ui.waiting;
    if(myTurn&&c&&c.kind==='tigress')return`<div class="btns"><button class="btn red ${ui.justSel?'wake':''}" data-act="play" data-as="pirate">Play as Pirate</button><button class="btn ghost" data-act="play" data-as="escape">Play as Escape</button></div>`;
    if(myTurn)return hint(c?`Tap <b>${esc(Rules.cardName(c,v.cfg))}</b> again to play it`:'Your turn · tap a card to pick it');
    return hint(c?'Lined up · tap it again on your turn':'');
  }
  if(ui.waiting)return`<button class="btn" disabled>Locked in</button>`;
  if(handHidden(v)&&v.phase!=='roundEnd')return hint('Hand hidden · pass-and-play');
  if(v.phase==='bidding'){
    if(v.bids[me]!=null)return`<button class="btn" disabled>You bid ${v.bids[me]} · waiting for the crew</button>`;
    const chips=Array.from({length:v.cards+1},(_,b)=>`<button class="chip ${ui.just==='pick'+b?'just':''}" data-act="bidPick" data-v="${b}" aria-pressed="${ui.bidPick===b}">${b}</button>`).join('');
    return`<div class="chips" role="group" aria-label="Your bid">${chips}</div>
      <button class="btn ${ui.just&&ui.just.startsWith('pick')?'wake':''}" data-act="bid" ${ui.bidPick==null?'disabled':''}>${ui.bidPick==null?'Choose your bid':'Bid '+ui.bidPick}</button>`;
  }
  if(v.phase==='ability'&&v.pending.seat===me)return abilityPanel(v);
  if(v.phase==='roundEnd')return`<button class="btn" data-act="results">See round results</button>`;
  if(v.phase==='ability')return hint(`${esc(v.seats[v.pending.seat].name)} is deciding…`);
  return'';
}
function gameView(){
  const v=view,n=v.seats.length,me=v.me,tot=Rules.totals(v.log,v.cfg,n),R=v.log[v.round];
  const abil={abilities:v.cfg.abilities};
  const doneTricks=v.won.reduce((a,b)=>a+b,0)+R.destroyed;
  const pct=Math.max(3,((v.round+(v.phase==='roundEnd'?1:doneTricks/v.cards))/v.rounds)*100);
  const from=ui.lastPct==null?pct:ui.lastPct;ui.lastPct=pct;
  const trickEnd=v.phase==='trickEnd',res=trickEnd?v.lastTrick.result:null,multi=isPassAndPlay(v);
  const order=Array.from({length:n-1},(_,k)=>(me+1+k)%n);
  const seats=order.map(i=>{
    const p=v.seats[i],turn=(v.phase==='playing'&&v.turn===i)||(v.phase==='ability'&&v.pending.seat===i),won=res&&res.winner===i;
    return`<div class="seat ${turn?'turn':''} ${won?'won':''} ${ui.bump===i?'bump':''}">${avatar(p,'',`seat-${i}`)}${i===v.dealer?'<span class="dealer" title="Dealer">D</span>':''}${multi&&!p.bot?'<span class="human-tag" title="Human player">H</span>':''}
      <span class="sname">${esc(p.name)}</span>${seatBid(v,i)}<span class="sscore num">${tot[i]} pts</span></div>`;
  }).join('');
  const ls=v.phase==='playing'?Rules.leadSuit(v.trick.plays,v.deck):null;
  const plays=v.trick.plays.map((p,k)=>{
    const rot=((p.card*47)%11)-5;
    return`<div class="slot" data-key="c${p.card}" data-from="seat-${p.seat}">
      <div class="tc ${res&&k===res.winIndex?'win':''} ${res&&res.winner==null?'dead':''}" style="--rot:${rot}deg">${cardHTML(v.deck[p.card],{as:p.as,...abil})}</div>
      ${avatar(v.seats[p.seat],'xs')}</div>`;
  }).join('');
  const meP=v.seats[me],myTurn=v.phase==='playing'&&v.turn===me,legal=new Set(v.legal),hidden=handHidden(v);
  const smuggling=v.phase==='ability'&&v.pending.kind==='smuggler'&&v.pending.seat===me,fresh=new Set(smuggling?v.pending.drawn:[]);
  const hand=sortHand(v.hand,v.deck),{cw,ov}=handMetrics(hand.length);
  const handHtml=hidden?hand.map(()=>`<div class="hslot"><div class="hc">${cardBack()}</div></div>`).join(''):hand.map((id,k)=>{
    const locked=myTurn&&!legal.has(id),disc=smuggling&&ui.discard.includes(id);
    return`<button class="hslot ${ui.sel===id?'sel':''} ${v.deck[id].kind==='tigress'?'tigress':''} ${disc?'discard':''} ${fresh.has(id)?'fresh':''} ${locked?'locked':''}" data-act="pick" data-id="${id}" data-key="c${id}"
      data-from="deck" ${ui.deal?`data-delay="${k*70}"`:''} aria-label="${esc(Rules.cardName(v.deck[id],abil))}${locked?', must follow suit':ui.sel===id&&myTurn?', tap again to play':''}" aria-pressed="${ui.sel===id||disc}">
      <div class="hc">${cardHTML(v.deck[id],abil)}</div></button>`;
  }).join('');
  const canPeekLast=v.lastTrick&&(v.phase==='playing'||v.phase==='ability');
  return`<div class="game">
    <div class="g-top"><button class="icon-btn" data-act="home" aria-label="Leave table (game is saved)">${ICON.x}</button>
      <div class="bar grow" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><i style="width:${from}%" data-to="${pct}"></i></div>
      <button class="icon-btn" data-act="board" aria-label="Scoreboard">${ICON.table}</button></div>
    <div class="g-info"><span class="pill blue">Round ${v.round+1} of ${v.rounds}</span><span class="pill soft">${v.cards} ${v.cards===1?'card':'cards'}</span>
      ${v.phase==='playing'||trickEnd?`<span class="pill soft">Trick ${Math.min(v.cards,doneTricks+(trickEnd?0:1))} of ${v.cards}</span>`:''}
      ${R.wager[me]?`<span class="pill gold">Bet ${R.wager[me]}</span>`:''}</div>
    <div class="seats">${seats}</div>
    <div class="felt">
      ${ls?`<span class="pill soft lead pop"><i class="sdot s-${ls}"></i>Follow ${Rules.SUIT_NAME[ls]}</span>`:''}
      ${canPeekLast?`<button class="lastbtn" data-act="last">Last trick</button>`:''}
      <div class="trick" data-anchor="deck">${plays||`<p class="empty">${v.phase==='bidding'?'Cards are dealt.<br>Place your bids.':'Waiting for the lead…'}</p>`}</div>
      <div class="status" role="status">${statusText(v)}</div>${bonusText(v)}
    </div>
    <div class="mebar ${myTurn||(v.phase==='ability'&&v.pending.seat===me)?'turn':''} ${res&&res.winner===me?'won':''} ${ui.bump===me?'bump':''}">${avatar(meP,'',`seat-${me}`)}
      <div class="grow"><div class="pname">${esc(meP.name)}${me===v.dealer?' <span class="pill gold" style="padding:0 6px">Dealer</span>':''}</div><span class="muted num" style="font-size:14px">${tot[me]} pts</span></div>
      ${seatBid(v,me)}</div>
    <div class="hand ${hidden?'hidden':''} ${myTurn&&!ui.waiting?'myturn':''}" style="--cw:${cw}px;--ov:${ov}px">${handHtml}</div>
    <div class="actions">${actionsView(v)}</div>
  </div>`;
}
function curtainView(){
  const p=view.seats[view.me];
  return`<div class="curtain" role="dialog" aria-label="Pass the device">
    ${avatar(p,'lg')}<h1>Pass to ${esc(p.name)}</h1>
    <p class="muted">Only ${esc(p.name)} should look at the next screen.</p>
    <button class="btn" data-act="reveal">I'm ${esc(p.name)}, show my hand</button></div>`;
}

/* --- sheets --- */
function resultsSheet(){
  const v=view,n=v.seats.length,R=v.log[v.round],tot=Rules.totals(v.log,v.cfg,n);
  const sc=v.seats.map((_,i)=>Rules.scoreSeat(v.cfg,R,i)),H=humansOf(v);
  let tone,title;
  if(H.length===1){
    const mine=sc[H[0]];
    tone=mine.kind==='hit'?'good':mine.kind==='glance'?'mid':'bad';
    title=mine.kind==='hit'?(R.bids[H[0]]===0?'Zero hero!':'Bid made!'):mine.kind==='glance'?'Glancing blow':`Off by ${mine.diff}`;
  }else{
    const hits=H.filter(i=>sc[i].hit).length;
    tone=hits===H.length?'good':hits?'mid':'bad';title=`${hits} of ${H.length} humans hit their bid`;
  }
  const rows=v.seats.map((p,i)=>{const s=sc[i];
    const lab=s.kind==='hit'?'Made it':s.kind==='glance'?'Off by 1':`Off by ${s.diff}`;
    const extra=[s.bonus?`bonus +${s.bonus}`:'',s.wager?`bet ${sgn(s.wager)}`:'',R.giant&&R.giant.seat===i?`Giant ${R.giant.from}→${R.giant.to}`:''].filter(Boolean).join(' · ');
    return`<div class="res pop" style="animation-delay:${i*70}ms">${avatar(p,'sm')}<div class="grow"><b class="pname" style="font-size:15px">${esc(p.name)}</b>
      <small class="muted" style="display:block;font-size:12px">${lab} · bid ${R.bids[i]}, won ${R.tricks[i]}${extra?' · '+extra:''} · ${tot[i]} total</small></div>
      <span class="pts ${toneOf(s.total)}" data-count="${s.total}">0</span></div>`}).join('');
  const last=v.round===v.rounds-1;
  return`<div class="sheet-scrim" data-act="closeSheet"></div><div class="sheet ${tone}" role="dialog" aria-label="Round results"><div class="in">
    <div class="row">${mascot(tone==='bad'?'sad':'happy','sm '+(tone==='bad'?'droop':'jump'))}<div class="grow"><h2 class="title">${title}</h2><p>Round ${v.round+1} of ${v.rounds}</p></div></div>
    <div class="stack" style="gap:8px">${rows}</div>
    <button class="btn ${tone==='bad'?'red':tone==='mid'?'gold':''} wake late" data-act="next">${last?'See final scores':'Next round'}</button>
  </div></div>`;
}
function boardSheet(v=view,editable=false){
  const n=v.seats.length,tot=Rules.totals(v.log,v.cfg,n),run=fill(n,0);
  const rank=tot.map((t,i)=>({t,i})).sort((a,b)=>b.t-a.t);
  const body=v.log.map((R,r)=>!R.done?'':`<tr ${editable?`class="editable" data-act="trkEdit" data-r="${r}" title="Fix round ${r+1}"`:''}><td>${r+1}<small class="muted" style="display:block;font-size:11px">${R.cards}c</small></td>${v.seats.map((_,i)=>{
    const s=Rules.scoreSeat(v.cfg,R,i);run[i]+=s.total;
    return`<td class="cell"><b class="${toneOf(s.total)}">${sgn(s.total)}</b><small>${R.bids[i]}/${R.tricks[i]}${s.bonus?' ★'+s.bonus:''}${s.wager?' $'+s.wager:''} · ${run[i]}</small></td>`}).join('')}</tr>`).join('');
  return`<div class="sheet-scrim" data-act="closeSheet"></div><div class="sheet" role="dialog" aria-label="Scoreboard"><div class="in">
    <div class="row"><h2 class="grow">Scoreboard</h2><button class="icon-btn" data-act="closeSheet" aria-label="Close">${ICON.x}</button></div>
    <div class="lb">${rank.map((x,k)=>`<div class="li"><span class="rank ${k<3?'r'+(k+1):''}">${k+1}</span>${avatar(v.seats[x.i],'sm')}<span class="grow pname">${esc(v.seats[x.i].name)}</span><span class="total">${x.t}</span></div>`).join('')}</div>
    ${body?`<div class="tablewrap"><table><thead><tr><th>Rd</th>${v.seats.map(p=>`<th>${esc(p.name)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>
      <p class="muted" style="font-size:13px">${editable?'Tap a round to fix it. ':''}Each cell: round points, bid/won, ★ bonus, $ bet, running total.</p>`:'<p class="muted">Scores appear after the first round.</p>'}
  </div></div>`;
}
function lastSheet(){
  const v=view,lt=v.lastTrick,r=lt.result,abil={abilities:v.cfg.abilities};
  return`<div class="sheet-scrim" data-act="closeSheet"></div><div class="sheet" role="dialog" aria-label="Last trick"><div class="in">
    <div class="row"><h2 class="grow">Last trick</h2><button class="icon-btn" data-act="closeSheet" aria-label="Close">${ICON.x}</button></div>
    <div class="cardrow">${lt.plays.map((p,k)=>`<div class="slot"><div class="tc ${k===r.winIndex?'win':''}">${cardHTML(v.deck[p.card],{as:p.as,...abil})}</div>${avatar(v.seats[p.seat],'xs')}</div>`).join('')}</div>
    <p style="text-align:center">${r.winner==null?'Nobody won it.':`${who(v,r.winner)} won it.`}</p>
  </div></div>`;
}
function peekSheet(){
  const v=view,cards=sortHand((v.pending&&v.pending.peek)||[],v.deck);
  return`<div class="sheet-scrim" data-act="seerDone"></div><div class="sheet" role="dialog" aria-label="Undealt cards"><div class="in">
    <div class="row"><h2 class="grow">Not in play this round</h2></div>
    <p class="muted">Nobody holds these ${cards.length} cards. Only you can see this.</p>
    <div class="cardrow">${cards.map(id=>cardHTML(v.deck[id],{abilities:v.cfg.abilities})).join('')}</div>
    <button class="btn" data-act="seerDone">Done</button>
  </div></div>`;
}
function rulesSheet(){
  const c=(kind,suit,rank)=>cardHTML({kind,suit,rank});
  return`<div class="sheet-scrim" data-act="closeSheet"></div><div class="sheet" role="dialog" aria-label="How to play"><div class="in rules">
    <div class="row"><h2 class="grow">How to play</h2><button class="icon-btn" data-act="closeSheet" aria-label="Close">${ICON.x}</button></div>
    <p>Each round you get one more card. Look at your hand and bid exactly how many tricks you'll win. Hitting your bid is everything.</p>
    <h3>Who wins a trick</h3>
    <div class="ladder">${c('escape')}<b>&lt;</b>${c('num','green',9)}<b>&lt;</b>${c('num','black',2)}<b>&lt;</b>${c('mermaid')}<b>&lt;</b>${c('pirate')}<b>&lt;</b>${c('sk')}<b>&lt;</b>${c('mermaid')}</div>
    <ul><li>Follow the suit that was led if you can. Special cards can always be played.</li>
    <li>Black Jolly Roger cards trump the other suits.</li><li>Mermaids beat numbers, Pirates beat Mermaids, the Skull King beats Pirates, and a Mermaid catches the Skull King.</li>
    <li>When two equal specials meet, the first one played wins. Tigress plays as a Pirate or an Escape.</li></ul>
    <h3>Scoring</h3>
    <ul><li>Hit a bid of 1+: <b>+20 per trick</b>. Miss: <b>−10 per trick</b> you were off.</li><li>Bid 0 and take none: <b>+10 × cards</b>. Take any: <b>−10 × cards</b>.</li>
    <li>Bonuses if you hit your bid: 14s +10 (black +20), Mermaid taken by a Pirate +20, Pirate taken by the King +30, King taken by a Mermaid +40.</li>
    <li>Rascal's scoring: everyone plays for 10 × cards. Off by 1 earns half, off by 2 earns nothing.</li></ul>
    <h3>Pirate abilities</h3>
    <ul>${Object.values(Rules.ABILITY).map(a=>`<li><b>${a.name}</b>: ${a.desc}</li>`).join('')}<li>A power only works when that Pirate wins the trick. The Tigress has no power.</li></ul>
    <h3>Advanced cards</h3>
    <ul><li>Kraken: nobody wins the trick. White Whale: specials stop counting, highest number wins.</li><li>Loot: acts as an Escape. Whoever takes it allies with its owner; +20 each if both hit their bids.</li></ul>
  </div></div>`;
}
function soundSheet(){
  const vol=Math.round((prefs.volume==null?.8:prefs.volume)*100),canBuzz=!!navigator.vibrate;
  const tg=(k,on,t,d)=>`<button class="toggle" data-act="sndToggle" data-k="${k}" aria-pressed="${on}"><span class="grow">${t}<small>${d}</small></span><span class="switch"></span></button>`;
  return`<div class="sheet-scrim" data-act="closeSheet"></div><div class="sheet" role="dialog" aria-label="Sound settings"><div class="in">
    <div class="row"><h2 class="grow">Sound</h2><button class="icon-btn" data-act="closeSheet" aria-label="Close">${ICON.x}</button></div>
    ${tg('sfx',!prefs.muted,'Sound effects','Cards, captures, the finale and button taps.')}
    <label class="vol ${prefs.muted?'off':''}" for="vol"><span class="row"><span class="label grow">Volume</span><b id="vol-out" class="num">${vol}%</b></span>
      <input type="range" id="vol" min="0" max="100" step="5" value="${vol}" ${prefs.muted?'disabled':''}></label>
    ${tg('ambience',!!prefs.ambience,'Sea ambience','Gentle waves in the background.')}
    ${canBuzz?tg('haptics',prefs.haptics!==false,'Vibration','A short buzz when you play a card or win a trick.'):''}
  </div></div>`;
}
const SHEETS={sound:soundSheet,results:resultsSheet,board:boardSheet,rules:rulesSheet,last:lastSheet,peek:peekSheet};

/* --- end of game --- */
function awards(v){
  const n=v.seats.length,stat=v.seats.map(()=>({hits:0,bonus:0,best:-Infinity,long:0,cur:0}));
  v.log.filter(R=>R.done).forEach(R=>{for(let i=0;i<n;i++){const s=Rules.scoreSeat(v.cfg,R,i),x=stat[i];
    if(s.hit){x.hits++;x.cur++;x.long=Math.max(x.long,x.cur)}else x.cur=0;
    x.bonus+=s.bonus;x.best=Math.max(x.best,s.total)}});
  const top=(f,min=0)=>{const m=Math.max(...stat.map(f));return m>min?{v:m,who:stat.map((x,i)=>f(x)===m?esc(v.seats[i].name):null).filter(Boolean).join(' & ')}:null};
  const A=[];let a;
  if((a=top(x=>x.hits)))A.push({c:'var(--green)',i:ICON.target,t:'Sharpshooter',d:`${a.who} · ${a.v} bids made`});
  if((a=top(x=>x.long,1)))A.push({c:'var(--orange)',i:ICON.wave,t:'Hot streak',d:`${a.who} · ${a.v} in a row`});

}
const trkRound=()=>trk.log[trk.edit!=null?trk.edit:trk.cur];

function trkStreak(i){let s=0;for(let r=trk.log.length-1;r>=0;r--){const R=trk.log[r];if(!R.done)continue;if(Rules.scoreSeat(trk.cfg,R,i).hit)s++;else break}return s}
const flame=n=>n>=2?`<span class="flame" title="${n} bids in a row">${ICON.flame}${n}</span>`:'';
const mini=c=>`<span class="mini">${cardHTML(c,{abilities:true})}</span>`;

/** Everything that can't be true about a finished round, in plain words. */
function trkValidate(R){
  const n=trk.seats.length,o=trk.cfg,e=[],name=i=>trk.seats[i].name,sum=a=>a.reduce((x,y)=>x+(y||0),0);
  if(R.bids.some(b=>b==null))e.push('Every pirate needs a bid.');
  if(R.tricks.some(t=>t==null))e.push('Enter tricks won for every pirate.');
  const target=R.cards-(R.destroyed||0);
  if(!R.tricks.some(t=>t==null)&&sum(R.tricks)!==target)e.push(`Tricks add up to ${sum(R.tricks)}, but ${target} ${target===1?'trick was':'tricks were'} won this round.`);
  if(sum(R.b14)>3)e.push('There are only three standard 14s.');
  if(sum(R.mp)>2)e.push('There are only two Mermaids.');
  if(sum(R.ps)>6)e.push('There are only six Pirates, counting the Tigress.');
  if(R.sm>=0&&sum(R.ps)>0)e.push('If a Mermaid caught the Skull King, he never won a trick, so no Pirate bonuses.');
  if(R.ps.filter(x=>x>0).length>1)e.push('Only one pirate holds the Skull King, so only one can capture Pirates with him.');
  for(let i=0;i<n;i++)if((R.b14[i]||R.black14===i||R.mp[i]||R.ps[i]||R.sm===i)&&R.tricks[i]===0)e.push(`${name(i)} took no tricks, so can't have captured bonus cards.`);
  R.loot.forEach((a,k)=>{
    if(a.from<0||a.to<0)e.push(`Loot ${k+1}: pick who played it and who took it.`);
    else if(a.from===a.to)e.push(`Loot ${k+1}: an alliance needs two different pirates.`);
    else if(R.tricks[a.to]===0)e.push(`Loot ${k+1}: ${name(a.to)} took no tricks, so couldn't capture it.`);
  });
  if((R.destroyed||0)>(o.kraken?1:0)+(o.whale?1:0))e.push('More tricks destroyed than beasts in the deck.');
  return[...new Set(e)];
}

function trkResultsSheet(){
  const t=trk,R=trkRound(),n=t.seats.length,before=fill(n,0);
  t.log.forEach((X,r)=>{if(X.done&&r<t.cur)for(let i=0;i<n;i++)before[i]+=Rules.scoreSeat(t.cfg,X,i).total});
  const sc=t.seats.map((_,i)=>Rules.scoreSeat(t.cfg,R,i)),hits=sc.filter(s=>s.hit).length;
  const after=before.map((b,i)=>b+sc[i].total),top=i=>after.indexOf(Math.max(...after));
  const tone=hits===n?'good':hits*2>=n?'mid':'bad';
  const title=hits===n?'Perfect round!':hits===0?'Rough seas!':hits*2>=n?'Well sailed!':'Choppy waters';
  const leadBefore=before.indexOf(Math.max(...before)),leadNow=top();
  const leadMsg=t.cur>0&&leadBefore!==leadNow?`${esc(t.seats[leadNow].name)} takes the lead!`:`${esc(t.seats[leadNow].name)} leads with ${after[leadNow]}`;
  const rows=t.seats.map((p,i)=>{const s=sc[i],st=s.hit?trkStreak(i)+1:0;
    const lab=s.kind==='hit'?'Bid made':s.kind==='glance'?'Glancing blow':`Off by ${s.diff}`;
    const extra=[s.bonus?`bonus +${s.bonus}`:'',s.wager?`bet ${sgn(s.wager)}`:''].filter(Boolean).join(' · ');
    return`<div class="res pop" style="animation-delay:${i*70}ms">${avatar(p,'sm')}<div class="grow"><div class="row" style="gap:6px"><b class="pname" style="font-size:15px">${esc(p.name)}</b>${flame(st)}</div>
      <small class="muted" style="display:block;font-size:12px">${lab} · bid ${R.bids[i]}, won ${R.tricks[i]}${extra?' · '+extra:''}</small></div>
      <span class="pts ${toneOf(s.total)}" data-count="${s.total}">0</span></div>`}).join('');
  const last=t.cur===t.schedule.length-1;
  return`<div class="sheet-scrim" data-act="closeSheet"></div><div class="sheet ${tone}" role="dialog" aria-label="Round results"><div class="in">
    <div class="row">${mascot(tone==='bad'?'sad':'happy','sm '+(tone==='bad'?'droop':'jump'))}<div class="grow"><h2 class="title">${title}</h2><p style="font-size:15px">${hits} of ${n} made their bid · ${leadMsg}</p></div></div>
    <div class="stack" style="gap:8px">${rows}</div>
    <button class="btn ${tone==='bad'?'red':tone==='mid'?'gold':''} wake late" data-act="trkNext">${last?'See final scores':'Next round'}</button>
    <button class="btn ghost" data-act="closeSheet">Fix something</button>
  </div></div>`;
}

/* ---------- 11. Stats ---------- */
function dayKey(d){return`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`}
/** Solo games only: pass-and-play results would mix several people's records. */
function recordGame(v){
  const H=humansOf(v);if(H.length!==1)return;
  const me=H[0],tot=Rules.totals(v.log,v.cfg,v.seats.length);
  stats.games++;
  if(tot[me]===Math.max(...tot))stats.wins++;
  v.log.forEach(R=>{if(!R.done)return;stats.bids++;if(R.bids[me]===R.tricks[me])stats.made++});
  stats.best=stats.best==null?tot[me]:Math.max(stats.best,tot[me]);
  const today=dayKey(new Date()),y=new Date();y.setDate(y.getDate()-1);
  if(stats.lastDay!==today)stats.streak=stats.lastDay===dayKey(y)?stats.streak+1:1;
  stats.lastDay=today;
  Store.set(Store.STATS,stats);
}

/* ---------- 12. Motion ---------- */
/** FLIP: remember where keyed elements were, then animate them from there after re-render. */
function snapshot(){
  const keys=new Map(),anchors=new Map();
  $$('[data-key]').forEach(el=>keys.set(el.dataset.key,el.getBoundingClientRect()));
  $$('[data-anchor]').forEach(el=>anchors.set(el.dataset.anchor,el.getBoundingClientRect()));
  return{keys,anchors};
}
function flip(snap){
  if(!snap||reduced())return;
  $$('[data-key]').forEach(el=>{
    const now=el.getBoundingClientRect();
    let from=snap.keys.get(el.dataset.key),fresh=false;
    if(!from&&el.dataset.from){
      const anchorEl=$(`[data-anchor="${el.dataset.from}"]`);
      const a=snap.anchors.get(el.dataset.from)||(anchorEl&&anchorEl.getBoundingClientRect());
      if(a){from={left:a.left+a.width/2-now.width/2,top:a.top+a.height/2-now.height/2,width:now.width};fresh=true}
    }
    if(!from)return;
    const dx=from.left-now.left,dy=from.top-now.top,sc=fresh?.4:from.width/now.width;
    if(Math.abs(dx)<1&&Math.abs(dy)<1&&Math.abs(sc-1)<.01)return;
    el.animate([{transform:`translate(${dx}px,${dy}px) scale(${sc})`,opacity:fresh?.2:1},{transform:'none',opacity:1}],
      {duration:fresh?460:340,delay:+(el.dataset.delay||0),easing:'cubic-bezier(.2,.9,.3,1.12)',fill:'backwards'});
  });
}
/** Sweep the finished trick to its winner, or sink it if a beast destroyed it. */
async function collectTrick(prev){
  if(reduced()||!prev||!prev.lastTrick)return;
  const slots=$$('.trick .slot');if(!slots.length)return;
  const w=prev.lastTrick.result.winner,target=w!=null&&$(`[data-anchor="seat-${w}"]`);
  const tr=target&&target.getBoundingClientRect();
  const anims=slots.map((el,k)=>{
    const r=el.getBoundingClientRect();
    const end=tr?`translate(${tr.left+tr.width/2-(r.left+r.width/2)}px,${tr.top+tr.height/2-(r.top+r.height/2)}px) scale(.22) rotate(${k*9-14}deg)`
      :`translateY(60px) scale(.5) rotate(${k%2?24:-24}deg)`;
    return el.animate([{transform:'none',opacity:1},{transform:end,opacity:tr?.4:0}],{duration:tr?440:560,delay:k*45,easing:'cubic-bezier(.55,0,.75,.2)',fill:'forwards'});
  });
  await Promise.all(anims.map(a=>a.finished.catch(()=>{})));
}
function animateBar(){
  const bar=$('.bar>i[data-to]');
  if(bar&&bar.style.width!==bar.dataset.to+'%'){bar.getBoundingClientRect();requestAnimationFrame(()=>{bar.style.width=bar.dataset.to+'%'})}
}
function countUp(){
  $$('[data-count]').forEach((el,k)=>{
    const end=+el.dataset.count,fmt=el.hasAttribute('data-plain')?String:sgn;
    if(reduced()){el.textContent=fmt(end);return}
    const t0=performance.now()+k*70,dur=650;
    const step=now=>{const p=clamp((now-t0)/dur,0,1);el.textContent=fmt(Math.round(end*(1-Math.pow(1-p,3))));if(p<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
}
/** Full-screen stamp text. words are stamped in sequence; sub is an optional caption. */
async function banner(words,sub){
  const el=document.createElement('div');
  el.className='banner'+(sub?' small':'');el.setAttribute('aria-hidden','true');
  el.innerHTML=`<div>${words.map((w,k)=>`<span style="animation-delay:${k*260}ms">${esc(w)}</span>`).join('')}</div>${sub?`<small>${esc(sub)}</small>`:''}`;
  document.body.appendChild(el);
  if(reduced()){await wait(500);el.remove();return}
  await wait(1150);
  el.animate([{opacity:1},{opacity:0}],{duration:180,fill:'forwards'});
  await wait(180);el.remove();
}
function confetti(){
  if(reduced())return;
  const c=$('#fx'),x=c.getContext('2d');if(!x)return;c.hidden=false;
  const W=c.width=innerWidth*devicePixelRatio,H=c.height=innerHeight*devicePixelRatio;
  const cols=['#58cc02','#1cb0f6','#ffc800','#ff4b4b','#ce82ff','#ff9600'];
  const P=Array.from({length:150},()=>({x:Math.random()*W,y:-Math.random()*H*.5,vx:(Math.random()-.5)*6,vy:2+Math.random()*5,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,s:(6+Math.random()*8)*devicePixelRatio,c:cols[Math.random()*6|0]}));
  const t0=performance.now();
  (function f(now){x.clearRect(0,0,W,H);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy*devicePixelRatio;p.vy+=.04;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    if(now-t0<3200)requestAnimationFrame(f);else{x.clearRect(0,0,W,H);c.hidden=true}})(t0);
}

/* ---------- Finale: others -> winner -> awards ---------- */
let finaleToken=0;
function countTo(el,dur=700){
  if(!el)return;
  const end=+el.dataset.final;
  if(reduced()){el.textContent=end;return}
  const t0=performance.now();
  const step=now=>{const p=clamp((now-t0)/dur,0,1);el.textContent=Math.round(end*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}
/** Reveal the standings from last place up, build suspense, crown the winner, then flip in the awards. */
async function playFinale(){
  const token=++finaleToken;
  const alive=()=>token===finaleToken&&ui.screen==='end'&&!ui.finaleDone;
  if(reduced())return finishFinale();
  await wait(700);if(!alive())return;
  const rows=$$('.standings li').sort((a,b)=>a.dataset.step-b.dataset.step);
  const gap=clamp(2800/Math.max(1,rows.length),450,800);
  for(let k=0;k<rows.length;k++){
    rows[k].classList.add('in');countTo(rows[k].querySelector('[data-final]'),500);Sound.play('tick',k);
    await wait(gap);if(!alive())return;
  }
  const hero=$('.hero-win');
  hero.classList.add('suspense');Sound.play('drum');
  await wait(1700);if(!alive())return;
  hero.classList.add('revealed');countTo(hero.querySelector('.reveal [data-final]'),900);Sound.play('fanfare');confetti();
  await wait(1500);if(!alive())return;
  const tiles=$$('.award');
  for(let k=0;k<tiles.length;k++){tiles[k].classList.add('in');Sound.play('chime',k);await wait(380);if(!alive())return}
  await wait(250);if(!alive())return;
  finishFinale();
}
/** Jump to the final state (end of the sequence, a tap to skip, or leaving the screen). */
function finishFinale(){
  ui.finaleDone=true;finaleToken++;
  const root=$('.end');if(!root)return;
  root.classList.add('done');
  $$('[data-final]',root).forEach(el=>{el.textContent=el.dataset.final});
}

function render(){

function go(screen){if(screen!=='home'){ui.swipeOpen=null;ui.undo=null;clearTimeout(undoTimer)}ui.screen=screen;ui.enter=true;ui.sheet=null;ui.pillIntro=screen==='home';window.scrollTo(0,0);render();ui.pillIntro=false}

/** One trick, several layers: who took it, what was captured, and any beast that interfered. */
function trickSounds(v,e){
  if(e.effect==='kraken')return Sound.play('kraken');
  if(e.effect==='whale'&&e.winner==null)return Sound.play('whale');
  if(e.effect==='whale')Sound.play('whale');
  Sound.play(e.winner===v.me?'trickWin':'trickLose');
  if(e.winner===v.me)Sound.buzz(20);
  const c=v.lastTrick&&v.lastTrick.result.captures;if(!c)return;
  if(c.sm)setTimeout(()=>Sound.play('gong'),180);
  else if(c.ps)setTimeout(()=>Sound.play('clash'),180);
  else if(c.mp)setTimeout(()=>Sound.play('harp'),180);
  if(c.b14||c.black14)setTimeout(()=>Sound.play('coins'),380);
}

/* ---------- 14. Table updates (queued so animations never overlap) ---------- */
const queue=[];let pumping=false;
function onTableUpdate(events,getView){queue.push({events,getView});pump()}
async function pump(){
  if(pumping)return;pumping=true;
  while(queue.length){const {events,getView}=queue.shift();try{await present(events,getView)}catch(e){console.error(e)}}
  pumping=false;
}
async function present(events,getView){
  const has=t=>events.some(e=>e.type===t),find=t=>events.find(e=>e.type===t);
  const onTable=ui.screen==='game'&&!ui.curtain;
  if(has('trickCollected')&&onTable)await collectTrick(view);
  if(has('bidsRevealed')&&onTable){Sound.play('yoho');await banner(['Yo','-ho','-ho!'])}
  const started=find('abilityStarted');
  if(started&&onTable){Sound.play('power');await banner([Rules.ABILITY[started.kind].name],Rules.ABILITY[started.kind].desc)}
  syncSeat(getView);
  ui.waiting=false;
  if(ui.screen!=='game')return;
  const v=view;
  events.forEach(e=>{
    if(e.type==='cardPlayed'){ui.toast=null;if(e.seat!==v.me)Sound.play('cardPlay',e.seat)}
    if(e.type==='bidPlaced')ui.just='bid'+e.seat;
    if(e.type==='trickResolved')trickSounds(v,e);
    if(e.type==='trickCollected')Sound.play('sweep');
    if(e.type==='abilityUsed')ui.toast=abilityToast(v,e);
  });
  if(has('trickCollected'))ui.bump=find('trickCollected').winner;
  if(has('bidsRevealed'))ui.reveal=true;
  if(has('roundStarted')){Sound.play('deal',v.cards)}
  if(has('roundStarted'))Object.assign(ui,{deal:true,sel:null,bidPick:null,sheet:null,toast:null});
  if(started&&started.seat===v.me&&started.kind==='seer'&&!ui.curtain)ui.sheet='peek';
  if(started&&started.kind==='smuggler')ui.discard=[];
  if(has('roundEnded')){
    ui.sheet='results';ui.anim=true;ui.toast=null;
    const H=humansOf(v),R=v.log[v.round],good=H.some(i=>Rules.scoreSeat(v.cfg,R,i).hit);
    Sound.play(good?'roundGood':'roundBad');
    if(H.length===1&&good){let st=0;for(let r=v.round;r>=0;r--){if(Rules.scoreSeat(v.cfg,v.log[r],H[0]).hit)st++;else break}if(st>=3)setTimeout(()=>Sound.play('streak',st),520)}
  }
  if(v.phase==='playing'&&v.turn===v.me&&ui.sel!=null&&!v.legal.includes(ui.sel))ui.sel=null;
  if(v.phase==='playing'&&v.turn===v.me&&(has('cardPlayed')||has('trickCollected')||has('abilityUsed'))&&!ui.curtain){Sound.play('yourTurn');Sound.buzz(15)}
  if(has('gameOver')){recordGame(v);Store.set(Store.GAME,null);if(table)table.stop();ui.endFrom='game';ui.finaleDone=false;go('end');playFinale();return}
  render();
}

  scoring(d){prefs.scoring=d.v;savePrefs();render()},
  format(d){prefs.format=d.v;savePrefs();render()},
  tog(d){prefs[d.k]=!prefs[d.k];Sound.play(prefs[d.k]?'toggleOn':'toggleOff');savePrefs();render()},
  start(){Sound.play('start');startGame()},
  again(){
    finaleToken++;
    if(ui.endFrom==='track'){trk=trkCreate(trk.seats.map(p=>p.name),trk.cfg);Tracker.save();Object.assign(ui,{lastPct:0,open:{}});return go('track')}
    startGame();
  },
  bidPick(d){ui.bidPick=+d.v;ui.just='pick'+d.v;Sound.play('bidTick',+d.v);render()},
  bid(){if(ui.bidPick==null)return;const b=ui.bidPick;ui.bidPick=null;act({type:'bid',seat:view.me,bid:b})},
  pick(d,el){
    const id=+d.id,v=view;
    if(v.phase==='ability'&&v.pending.kind==='smuggler'&&v.pending.seat===v.me){
      const k=v.pending.drawn.length,i=ui.discard.indexOf(id);
      if(i>=0)ui.discard.splice(i,1);else if(ui.discard.length<k)ui.discard.push(id);
      Sound.play('select2');return render();
    }
    const myTurn=v.phase==='playing'&&v.turn===v.me;
    if(v.phase!=='bidding'&&v.phase!=='playing')return;
    if(myTurn&&!v.legal.includes(id)){Sound.play('nope');Sound.buzz(40);el.classList.remove('nope');void el.offsetWidth;el.classList.add('nope');return}
    if(myTurn&&ui.sel===id){
      if(v.deck[id].kind!=='tigress')return myPlay();   // second tap on the lifted card plays it
      ui.justSel=true;return render();                  // Tigress: nudge the Pirate / Escape choice
    }
    ui.sel=ui.sel===id&&!myTurn?null:id;ui.justSel=ui.sel!=null;Sound.play('select2');render();
  },
  play(d){myPlay(d.as)},
  ability(d){
    if(view.pending&&view.pending.kind==='smuggler'){const ch=ui.discard.slice();ui.discard=[];return useAbility(ch)}
    useAbility(d.v==null?null:+d.v);
  },
  next(){ui.sheet=null;act({type:'advance'})}
};
Object.assign(ACTIONS,TRK_ACTIONS);
/** Plain interface sounds by action. Actions with sounds that depend on what happened call Sound.play themselves. */
const UI_SOUNDS={home:'back',setup:'tap',resume:'confirm',rules:'sheetUp',board:'sheetUp',last:'sheetUp',results:'sheetUp',peek:'sheetUp',
  soundSheet:'sheetUp',closeSheet:'sheetDown',seerDone:'sheetDown',reveal:'whoosh',next:'confirm',again:'start',bid:'confirm',ability:'confirm',
  scoring:'select',format:'select',level:'select',crewKind:'select',crewAdd:'select',crewRm:'back',undoCancel:'undo',
  track:'tap',trkScoring:'select',trkFormat:'select',trkCrewAdd:'select',trkCrewRm:'back',trkBoard:'sheetUp',trkEdit:'tap',
  trkOpen:'tap',trkBackBids:'back',trkNext:'confirm',trkCheck:'tap'};
const CLOSING=new Set(['closeSheet','next','seerDone','trkNext']);
const GAME_INPUT=new Set(['bid','bidPick','pick','play','ability','peek','seerDone','next']);
let busy=false;
document.addEventListener('click',e=>{
  if(swipeSuppressClick){swipeSuppressClick=false;return}
  if(ui.swipeOpen&&!e.target.closest('.swipe-del')){setSwipe(null);return}
  const el=e.target.closest('[data-act]');
  if(!el||el.disabled||busy)return;
  const fn=ACTIONS[el.dataset.act];if(!fn)return;
  if(ui.waiting&&GAME_INPUT.has(el.dataset.act))return;
  const d=Object.assign({},el.dataset);
  if(UI_SOUNDS[d.act])Sound.play(UI_SOUNDS[d.act]);
  const sheets=$$('.sheet,.sheet-scrim');
  if(CLOSING.has(d.act)&&sheets.length&&!reduced()){
    busy=true;sheets.forEach(s=>s.classList.add('leaving'));
    setTimeout(()=>{busy=false;fn(d,el)},190);return;
  }
  fn(d,el);
});
document.addEventListener('input',e=>{
  const ti=e.target.dataset&&e.target.dataset.tcrew;
  if(ti!=null){
    prefs.track.players[+ti].name=e.target.value;savePrefs();
    const av=e.target.parentNode.querySelector('.avatar');if(av)av.innerHTML=initial(e.target.value||String(+ti+1));
    return;
  }
  const i=e.target.dataset&&e.target.dataset.crew;
  if(i==null)return;
  prefs.crew[+i].name=e.target.value;savePrefs();
  const av=e.target.parentNode.querySelector('.avatar');if(av)av.innerHTML=initial(e.target.value||(prefs.crew[+i].bot?'B':'Y'));
});
document.addEventListener('change',e=>{
  const k=e.target.dataset&&e.target.dataset.tloot;
  if(k==null||!trk)return;
  trkRound().loot[+k][e.target.dataset.f]=+e.target.value;Tracker.save();render();
});
document.addEventListener('keydown',e=>{
  if(e.target.classList&&e.target.classList.contains('swipe-front')){
    if(e.key==='ArrowLeft'){const root=e.target.closest('.swipe');setSwipe(root.dataset.swipe);$('.swipe-del',root).focus();return}
  }
  if(ui.swipeOpen&&(e.key==='Escape'||e.key==='ArrowRight')){const f=$(`.swipe-${ui.swipeOpen} .swipe-front`);setSwipe(null);if(f)f.focus();return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.sheet&&!['results','peek'].includes(ui.sheet)){ui.sheet=null;render()}});
let resizeTimer=null;
addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(ui.screen==='game')render()},150)});

/* ---------- Swipe to reveal (pointer driven, works for touch and mouse) ---------- */
let swipeDrag=null,swipeSuppressClick=false,undoTimer=null;
/** Open one swipe row by id, or close all with null. */
function setSwipe(id){
  ui.swipeOpen=id;
  $$('.swipe').forEach(root=>{
    const open=root.dataset.swipe===id;
    root.classList.remove('dragging','hint');
    root.style.setProperty('--p',open?1:0);
    root.classList.toggle('open',open);
    const del=$('.swipe-del',root);if(del)del.tabIndex=open?0:-1;
  });
  if(id){Sound.play('swipeOpen');Sound.buzz(8)}
}
document.addEventListener('pointerdown',e=>{
  const front=e.target.closest('.swipe-front');
  if(!front||e.button>0)return;
  const root=front.closest('.swipe'),id=root.dataset.swipe;
  if(ui.swipeOpen&&ui.swipeOpen!==id)setSwipe(null);           // only one row open at a time
  const p0=ui.swipeOpen===id?1:0;
  swipeDrag={root,row:id,id:e.pointerId,x0:e.clientX,y0:e.clientY,t0:performance.now(),p0,p:p0,moved:false};
});
addEventListener('pointermove',e=>{
  const d=swipeDrag;if(!d||e.pointerId!==d.id)return;
  const dx=e.clientX-d.x0,dy=e.clientY-d.y0;
  if(!d.moved){
    if(Math.abs(dx)<8)return;
    if(Math.abs(dy)>Math.abs(dx)){swipeDrag=null;return}   // a vertical gesture belongs to scrolling
    d.moved=true;d.root.classList.remove('hint');d.root.classList.add('dragging');
  }
  const w=parseFloat(getComputedStyle(d.root).getPropertyValue('--del'))+12;
  let p=d.p0-dx/w;
  if(p>1)p=1+(p-1)*.25;else if(p<0)p*=.25;                  // rubber band past either end
  d.p=p;d.root.style.setProperty('--p',p.toFixed(3));
});
function endSwipe(e,cancelled){
  const d=swipeDrag;if(!d||e.pointerId!==d.id)return;
  swipeDrag=null;if(!d.moved)return;
  swipeSuppressClick=!cancelled;setTimeout(()=>{swipeSuppressClick=false},350);
  const v=(d.p-d.p0)/Math.max(1,performance.now()-d.t0)*1000;   // flick speed in widths per second
  const open=v>2.2?true:v<-2.2?false:d.p>.5;
  setSwipe(open?d.row:null);
}
addEventListener('pointerup',e=>endSwipe(e,false));
addEventListener('pointercancel',e=>endSwipe(e,true));
Object.assign(ACTIONS,{
  /** Delete what a swipe row stands for: the saved bot game or the scoresheet. Undo stays available for 5 seconds. */
  swipeDelete(d,el){
    const kind=d.swipe,root=el.closest('.swipe');
    if(kind==='track'){ui.undo={kind,data:trk};trk=null;Tracker.save()}
    else{ui.undo={kind,data:Store.loadGame()};Store.set(Store.GAME,null);if(table){table.stop();table=null}}
    ui.swipeOpen=null;Sound.play('trash');Sound.buzz(25);
    const done=()=>{if(kind==='track')ui.just='trackReset';render()};
    if(root&&!reduced()){
      const h=root.offsetHeight;
      const end=kind==='track'?{opacity:0,transform:'translateX(-24px) scale(.96)'}:{height:'0px',opacity:0,transform:'translateX(-24px) scale(.96)'};
      root.animate([{height:h+'px',opacity:1,transform:'none'},Object.assign({height:h+'px'},end)],{duration:280,easing:'cubic-bezier(.5,0,.75,0)',fill:'forwards'}).finished.then(done,done);
    }else done();
    clearTimeout(undoTimer);
    undoTimer=setTimeout(()=>{ui.undo=null;const bar=$('.undo-bar');if(bar&&!reduced())bar.animate([{opacity:1},{opacity:0}],{duration:200,fill:'forwards'}).finished.then(()=>{if(ui.screen==='home')render()});else if(ui.screen==='home')render()},5000);
  },
  undoCancel(){
    const u=ui.undo;
    if(u&&u.kind==='track'){trk=u.data;Tracker.save()}
    else if(u&&u.data)Store.saveGame(u.data);
    ui.undo=null;clearTimeout(undoTimer);render();
  }
});

addEventListener('pointerdown',()=>Sound.unlock(),{once:true,capture:true});
document.addEventListener('input',e=>{
  if(e.target.id!=='vol')return;
  prefs.volume=+e.target.value/100;savePrefs();Sound.setLevel();
  const out=$('#vol-out');if(out)out.textContent=e.target.value+'%';
});
document.addEventListener('change',e=>{if(e.target.id==='vol')Sound.play('tick',3)});

/* ---------- boot ---------- */
document.body.insertAdjacentHTML('afterbegin',SPRITE);
ui.pillIntro=true;render();ui.pillIntro=false;
window.SKT={Rules,Engine,Bots,LocalTable,Sound};   // handy for tests and the future server
})();
</script>

# Skull King Tavern: the API and the web client.
# The public entry is host ports (local overlay) or Nginx Proxy Manager (npm overlay).
# ./deploy.sh picks the overlay from PROXY_MODE in .env.
#
#   ./deploy.sh
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.npm.yml up -d --build
#
# Games live in the API process. A restart clears them. Accounts, sessions and stats live in Postgres.
#
# NPM targets (npm overlay, container DNS on proxy-network):
#   http://skt-web:80      the page, which also proxies /api/v1 and the socket
#   http://skt-api:8080    the API, for a client that does not go through the page

name: skt

x-log-rotation: &log-rotation
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: skt-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skt}
      POSTGRES_DB: ${POSTGRES_DB:-skt}
    networks:
      - skt-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skt} -d ${POSTGRES_DB:-skt}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *log-rotation
    restart: unless-stopped

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: skt-api
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      RUST_LOG: ${RUST_LOG:-info}
      SKT_PUBLIC_ORIGIN: ${SKT_PUBLIC_ORIGIN:-}
      SKT_SECURE_COOKIE: ${SKT_SECURE_COOKIE:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-skt}:${POSTGRES_PASSWORD:-skt}@postgres:5432/${POSTGRES_DB:-skt}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - skt-internal
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:8080/api/v1/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging: *log-rotation
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
    container_name: skt-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_UPSTREAM: http://api:8080
    networks:
      - skt-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging: *log-rotation
    restart: unless-stopped

networks:
  skt-internal:
    name: skt-internal
    driver: bridge

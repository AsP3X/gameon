# Skull King Tavern: the API and the web client.
# The public entry is host ports (local overlay) or Nginx Proxy Manager (npm overlay).
# ./deploy.sh picks the overlay from PROXY_MODE in .env.
#
#   ./deploy.sh
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.npm.yml up -d --build
#
# A restart replays games that were still running from open_games. Accounts live in Postgres.
# Postgres keeps them in the named volume skt_pg_data. SKT_DATA_DIR is optional: when it is
# set, docker-compose.data-dir.yml stores them in that folder instead. ./deploy.sh --reset
# deletes the database and .env, so the next start opens setup. A container created before
# the volume existed keeps its files inside the container; ./deploy.sh refuses to recreate
# it until they are copied or reset.
#
# NPM targets (npm overlay, container DNS on proxy-network):
#   http://skt-web:80      the page, which also proxies /api/v1 and the socket
#   http://skt-api:8080    the API, for a client that does not go through the page
# The page's upstream is the container name skt-api. The service name api is not
# unique on a shared proxy-network: another stack's service of that name is
# returned too, and nginx then sends the game socket to the wrong server.
#
# The setup screen can attach more Docker networks. ./deploy.sh writes
# .deploy/networks.yml and passes it last, so those lists replace the ones here.

name: skt

services:
  postgres:
    image: postgres:16-alpine
    container_name: skt-postgres
    # warning is Postgres's own default. The setup screen can set another level.
    command:
      - postgres
      - -c
      - log_min_messages=${SKT_LOG_POSTGRES:-warning}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skt}
      POSTGRES_DB: ${POSTGRES_DB:-skt}
    volumes:
      - skt_pg_data:/var/lib/postgresql/data
    networks:
      - skt-internal
    healthcheck:
      # pg_isready succeeds when the server is up even if POSTGRES_DB was never
      # created. The API can connect only after this database accepts a query.
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER:-skt} -d ${POSTGRES_DB:-skt} -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: ${SKT_LOG_SIZE_POSTGRES:-10m}
        max-file: "${SKT_LOG_FILES_POSTGRES:-3}"
    restart: unless-stopped

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: skt-api
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      RUST_LOG: ${RUST_LOG:-info}
      # text or json. The Logging dialog does not write this. Unset means text.
      RUST_LOG_FORMAT: ${RUST_LOG_FORMAT:-text}
      SKT_PUBLIC_ORIGIN: ${SKT_PUBLIC_ORIGIN:-}
      SKT_SECURE_COOKIE: ${SKT_SECURE_COOKIE:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-skt}:${POSTGRES_PASSWORD:-skt}@postgres:5432/${POSTGRES_DB:-skt}
      # Docker bridge addresses. A direct connection to the published API port is not in this
      # list, so it cannot choose its own rate-limit key. Add the proxy-network subnet here
      # when Nginx Proxy Manager is not on 172.16.0.0/12.
      SKT_TRUSTED_PROXIES: ${SKT_TRUSTED_PROXIES:-172.16.0.0/12}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - skt-internal
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:8080/api/v1/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: ${SKT_LOG_SIZE_API:-10m}
        max-file: "${SKT_LOG_FILES_API:-3}"
    restart: unless-stopped

  # Ocho lobby and tables. Accounts stay on api. The page proxies /ocho/ here.
  ocho:
    build:
      context: ./server
      dockerfile: Dockerfile.ocho
    container_name: ocho
    environment:
      OCHO_HOST: 0.0.0.0
      OCHO_PORT: "8091"
      RUST_LOG: ${RUST_LOG:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-skt}:${POSTGRES_PASSWORD:-skt}@postgres:5432/${POSTGRES_DB:-skt}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - skt-internal
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:8091/ocho/v1/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
    container_name: skt-web
    depends_on:
      api:
        condition: service_healthy
      ocho:
        condition: service_healthy
    environment:
      # Container name. The service name api collides on a shared proxy-network.
      API_UPSTREAM: http://skt-api:8080
      OCHO_UPSTREAM: http://ocho:8091
      # notice matches the nginx image. The setup screen can set another level.
      NGINX_LOG_LEVEL: ${SKT_LOG_WEB:-notice}
    networks:
      - skt-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: ${SKT_LOG_SIZE_WEB:-10m}
        max-file: "${SKT_LOG_FILES_WEB:-3}"
    restart: unless-stopped

networks:
  skt-internal:
    name: skt-internal
    driver: bridge

volumes:
  skt_pg_data:
    name: skt_pg_data

[workspace]
resolver = "3"
members = [
    "crates/skt-engine",
    "crates/skt-protocol",
    "crates/skt-server",
    "crates/skt-bot-pass",
    "crates/ocho-engine",
    "crates/ocho-server",
]
default-members = ["crates/skt-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
axum = "0.8"
http-body-util = "0.1"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
static_assertions = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ts-rs = { version = "12", features = ["format"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

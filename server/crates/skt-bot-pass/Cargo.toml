[package]
name = "skt-bot-pass"
description = "Terminal pass of bot-versus-bot Skull King games"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "bot-pass"
path = "src/main.rs"

[dependencies]
# Events stay off. The windows feature is required or crossterm refuses to compile on Windows.
crossterm = { version = "0.29", default-features = false, features = ["windows"] }
ctrlc = "3.5"
skt-engine = { path = "../skt-engine" }
thiserror.workspace = true

[lints]
workspace = true

name: Server

on:
  push:
    paths:
      - "server/**"
      - "fixtures/engine/**"
      - "fixtures/protocol/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - "fixtures/engine/**"
      - "fixtures/protocol/**"
      - ".github/workflows/server.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: skt
          POSTGRES_PASSWORD: skt
          POSTGRES_DB: skt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skt -d skt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://skt:skt@127.0.0.1:5432/skt
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace
